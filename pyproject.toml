[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "toothfindings"
version = "1.0.0"
description = "Tooth-level classification of implants, endodontically treated, impacted and sound teeth on panoramic radiographs: research code and exported results."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Thiago Alves Vieira de Matos" },
    { name = "Alessandra Alaniz Macedo" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
# Everything needed to recompute the tables and figures from results/ (CPU only, no data).
# Versions in the comments are the ones the published numbers were produced with.
dependencies = [
    "numpy>=1.26",            # 2.2.6
    "scipy>=1.11",            # 1.15.3
    "scikit-learn>=1.4",      # 1.7.2
    "statsmodels>=0.14",      # 0.14.6
    "scikit-posthocs>=0.9",   # 0.14.0
    "pandas>=2.0",            # 2.3.3
    "matplotlib>=3.8",        # 3.10.8
    "Pillow>=10",             # 12.0.0
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Training, inference, enhancement and Grad-CAM (needs the restricted images).
train = [
    "torch>=2.2",             # 2.9.1+cu130
    "torchvision>=0.17",      # 0.24.1+cu130
    "timm>=1.0",              # 1.0.22
    "opencv-python>=4.8",     # 4.12.0
    "scikit-image>=0.22",     # 0.25.2
    "grad-cam>=1.5",          # 1.5.5
]
# Mouth detector and tooth segmenter of the external and end-to-end evaluations.
external = [
    "onnxruntime>=1.17",      # 1.23.2
    "ultralytics>=8.1",       # 8.3.241
]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
toothfindings = "toothfindings.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
toothfindings = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: recomputations that take more than a few seconds"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D"]
ignore = [
    "D105", "D107",  # magic methods and __init__ are documented on the class
    "D203", "D213",  # numpy convention
    "B905",          # zip(strict=) would change behaviour on Python 3.10 callers
    "B023",          # closures are only called within the loop iteration that defines them
    "D401",          # summaries may describe the returned value
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
